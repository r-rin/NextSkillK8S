spring.application.name=NextSkill-email-service
server.port=8081

spring.config.import=classpath:project.properties

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=activemquser
spring.activemq.password=activemqpassword
spring.activemq.packages.trusted=ukma.springboot.nextskill.common.dto

spring.boot.admin.client.url=http://localhost:8082
spring.boot.admin.client.instance.name=email-service
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
